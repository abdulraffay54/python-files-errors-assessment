<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Python Files and Errors Assessment banner</title>
  <desc id="bannerDesc">Project banner for two Python file-handling tools, with concept chips and a syntax-highlighted code window.</desc>
  <defs>
    <linearGradient id="bannerBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="260" fill="#ffffff"/>
  <rect x="24" y="20" width="952" height="220" rx="20" fill="url(#bannerBg)" stroke="#dbeafe" stroke-width="1.5"/>
  <rect x="44" y="20" width="912" height="8" rx="4" fill="url(#accentBar)"/>

  <rect x="48" y="48" width="214" height="28" rx="14" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="155" y="67" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8" letter-spacing="1">PYTHON • FILE HANDLING</text>

  <text x="48" y="111" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#0f172a">Python Files &amp; Errors Assessment</text>
  <text x="48" y="139" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#475569">Persist daily expenses in CSV and clean messy attendance names.</text>

  <rect x="48" y="166" width="100" height="30" rx="15" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="98" y="186" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#1d4ed8">CSV files</text>

  <rect x="158" y="166" width="112" height="30" rx="15" fill="#fee2e2" stroke="#fecaca"/>
  <text x="214" y="186" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#b91c1c">Exceptions</text>

  <rect x="280" y="166" width="64" height="30" rx="15" fill="#ede9fe" stroke="#ddd6fe"/>
  <text x="312" y="186" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#6d28d9">Sets</text>

  <rect x="354" y="166" width="154" height="30" rx="15" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="431" y="186" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#15803d">Comprehensions</text>

  <text x="48" y="223" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b">Repository: python-files-errors-assessment  •  Author: Abdul Rafay</text>

  <rect x="610" y="46" width="342" height="176" rx="14" fill="#0f172a" stroke="#1e293b"/>
  <circle cx="630" cy="65" r="4" fill="#ef4444"/>
  <circle cx="644" cy="65" r="4" fill="#f59e0b"/>
  <circle cx="658" cy="65" r="4" fill="#22c55e"/>
  <text x="672" y="70" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#cbd5e1">expense_tracker.py</text>

  <text x="628" y="99" font-family="Consolas, Courier New, monospace" font-size="12.5" fill="#e2e8f0">
    <tspan fill="#c4b5fd">import</tspan> csv
  </text>
  <text x="628" y="121" font-family="Consolas, Courier New, monospace" font-size="12.5" fill="#e2e8f0">
    <tspan fill="#c4b5fd">with</tspan> <tspan fill="#93c5fd">open</tspan>(<tspan fill="#86efac">"expenses.csv"</tspan>) <tspan fill="#c4b5fd">as</tspan> f:
  </text>
  <text x="628" y="143" font-family="Consolas, Courier New, monospace" font-size="12.5" fill="#e2e8f0">    reader = csv.DictReader(f)</text>
  <text x="628" y="165" font-family="Consolas, Courier New, monospace" font-size="12.5" fill="#e2e8f0">    rows = <tspan fill="#93c5fd">list</tspan>(reader)</text>
  <text x="628" y="187" font-family="Consolas, Courier New, monospace" font-size="12.5" fill="#94a3b8">    <tspan fill="#94a3b8"># saved records reload here</tspan></text>
  <text x="628" y="209" font-family="Consolas, Courier New, monospace" font-size="12.5" fill="#e2e8f0">    amount = <tspan fill="#93c5fd">float</tspan>(row[<tspan fill="#86efac">"amount"</tspan>])</text>
</svg>