<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="expenseFlowTitle expenseFlowDesc">
  <title id="expenseFlowTitle">Expense Tracker program flow</title>
  <desc id="expenseFlowDesc">Flowchart showing startup loading, menu input, validation, add and show actions, category totals, and the menu loop.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#ffffff"/>
  <text x="40" y="30" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Expense Tracker — Program Flow</text>
  <text x="40" y="50" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b">File handling, menu validation, input validation, CSV persistence, and the main loop.</text>

  <rect x="470" y="62" width="260" height="46" rx="23" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="600" y="90" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#15803d">START</text>
  <path d="M600 108 V140" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <rect x="440" y="140" width="320" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="600" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">Load expenses.csv</text>
  <text x="600" y="185" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#334155">Start with an empty list when the file is missing</text>

  <path d="M760 170 H810" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrowAmber)" fill="none"/>
  <text x="770" y="162" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#b45309">exception</text>
  <rect x="810" y="140" width="280" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="950" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#b45309">FileNotFoundError / read error</text>
  <text x="950" y="185" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#334155">Show a warning and continue with no rows</text>

  <path d="M600 200 V230" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <rect x="430" y="230" width="340" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="600" y="257" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">Show menu / read choice</text>
  <text x="600" y="277" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#334155">Options 1–4, then validate the menu choice</text>

  <path d="M600 294 V320" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M600 320 L750 365 L600 410 L450 365 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="600" y="361" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#6d28d9">Valid choice 1–4?</text>
  <text x="600" y="379" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#475569">otherwise show an error</text>

  <path d="M750 365 H820" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowRed)" fill="none"/>
  <text x="785" y="357" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#b91c1c">no</text>
  <rect x="820" y="330" width="260" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="950" y="357" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">Invalid choice</text>
  <text x="950" y="376" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#334155">Print a clear error and redisplay the menu</text>
  <path d="M950 330 V262 H770" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowRed)" fill="none"/>

  <path d="M600 410 V435 H160 M600 435 H430 M600 435 H700 M600 435 H970" stroke="#475569" stroke-width="1.5" fill="none"/>
  <path d="M160 435 V470" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M430 435 V470" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M700 435 V470" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M970 435 V470" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="172" y="455" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">1</text>
  <text x="442" y="455" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">2</text>
  <text x="712" y="455" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">3</text>
  <text x="982" y="455" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">4</text>

  <rect x="50" y="470" width="220" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="160" y="497" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#1d4ed8">Add New Expense</text>
  <text x="160" y="516" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155">Prompt date, item, category,</text>
  <text x="160" y="531" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155">and amount</text>

  <rect x="320" y="470" width="220" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="430" y="497" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#15803d">Show All Expenses</text>
  <text x="430" y="516" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155">Rows, unique categories,</text>
  <text x="430" y="531" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155">and overall total</text>

  <rect x="590" y="470" width="220" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="700" y="497" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#15803d">Total by Category</text>
  <text x="700" y="516" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155">Sum amounts using</text>
  <text x="700" y="531" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155">a set of categories</text>

  <rect x="860" y="470" width="220" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="970" y="497" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#15803d">Exit</text>
  <text x="970" y="516" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155">Leave the menu loop</text>

  <path d="M160 540 V575" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M160 575 L270 620 L160 665 L50 620 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="160" y="612" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#6d28d9">Valid date, text,</text>
  <text x="160" y="630" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#6d28d9">and amount &gt; 0?</text>

  <path d="M270 620 H320" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowRed)" fill="none"/>
  <text x="292" y="612" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#b91c1c">no</text>
  <rect x="320" y="585" width="200" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="420" y="612" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">Show clear error</text>
  <text x="420" y="631" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155">Re-prompt the same field</text>
  <path d="M320 620 H290 V505 H270" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowRed)" fill="none"/>

  <path d="M160 665 V700" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)" fill="none"/>
  <rect x="50" y="700" width="220" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="160" y="725" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#15803d">Append + save CSV</text>
  <text x="160" y="744" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#334155">Write expenses.csv</text>

  <path d="M530 540 V790" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)" fill="none"/>
  <path d="M700 540 V790" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)" fill="none"/>
  <path d="M160 760 V790 H400" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)" fill="none"/>

  <rect x="400" y="790" width="300" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="550" y="820" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">Return to menu</text>
  <path d="M400 815 H20 V262 H430" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="32" y="530" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#64748b" transform="rotate(-90 32 530)">main menu loop</text>

  <path d="M970 540 V790" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)" fill="none"/>
  <rect x="860" y="790" width="220" height="50" rx="25" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="970" y="820" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#15803d">END</text>
</svg>